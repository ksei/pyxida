# Pyxida stack for Docker Compose or Portainer.
# Portainer: Stacks → Add stack. Set APP_PASSWORD (and optionally ALLOWED_HOSTS,
# CODEX_MODEL, PYXIDA_PORT) under "Environment variables". See README → Docker.
services:
  pyxida:
    image: pyxida:latest
    build: .
    container_name: pyxida
    restart: unless-stopped
    ports:
      - "${PYXIDA_PORT:-8765}:8765"
    environment:
      # Required: password for the web interface.
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD for the Pyxida web interface}
      # Optional: comma-separated host names or host:port values allowed in the
      # browser address bar, e.g. "pyxida.home.lan,192.168.1.20:8765".
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      # Optional: override the Codex default model.
      CODEX_MODEL: ${CODEX_MODEL:-}
      # Optional: use "danger-full-access" only if Codex runs fail because the
      # container runtime blocks Codex's Linux sandbox (shell tools stay disabled).
      CODEX_SANDBOX: ${CODEX_SANDBOX:-read-only}
      TZ: ${TZ:-Europe/Zurich}
    volumes:
      - pyxida-data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  pyxida-data:
